services:

  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: policy-sqlserver
    platform: linux/amd64

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}

    ports:
      - "1433:1433"

    volumes:
      - policy-db-data:/var/opt/mssql


  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: policy-db-init
    platform: linux/amd64

    depends_on:
      - database

    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}

    volumes:
      - ./database/initialization-scripts:/scripts

    entrypoint:
      - /bin/bash
      - -c
      - |
        echo "Waiting for SQL Server..."

        until /opt/mssql-tools18/bin/sqlcmd \
          -S database \
          -U sa \
          -P "$$MSSQL_SA_PASSWORD" \
          -C \
          -Q "SELECT 1" > /dev/null 2>&1
        do
          sleep 2
        done

        echo "SQL Server is ready."

        /opt/mssql-tools18/bin/sqlcmd \
          -S database \
          -U sa \
          -P "$$MSSQL_SA_PASSWORD" \
          -C \
          -i /scripts/init.sql

        echo "Database initialization complete."


  app:
    build:
      context: ./PolicyCancellationTracker/PolicyCancellationTracker
      dockerfile: Dockerfile

    container_name: policy-cancellation-app

    depends_on:
      db-init:
        condition: service_completed_successfully

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=database,1433;Database=PolicyCancellationTracker;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      PolicyApiBaseUrl: "http://localhost:8080"

    ports:
      - "5284:8080"


volumes:
  policy-db-data:
