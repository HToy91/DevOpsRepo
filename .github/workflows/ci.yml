name: Build and test containers

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  DOTNET_VERSION: "10.0.x"
  
jobs:
  unit-tests:
    name: xUnit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          
      - name: Restore
        run: dotnet restore PolicyCancellationTracker/PolicyCancellationTracker.sln
        
      - name: Build
        run: dotnet build PolicyCancellationTracker/PolicyCancellationTracker.sln -c Release --no-restore
        
      - name: Test frontend
        run: dotnet test PolicyCancellationTracker.Frontend.Tests/PolicyCancellationTracker.Frontend.Tests.csproj -c Release --no-build --verbosity normal
        
      - name: Test backend
        run: dotnet test PolicyCancellationTracker.Backend.Tests/PolicyCancellationTracker.Backend.Tests.csproj -c Release --no-build --verbosity normal
        
  container-tests:
    name: Build container test stages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./PolicyCancellationTracker/PolicyCancellationTracker
          file: ./PolicyCancellationTracker/PolicyCancellationTracker/Dockerfile
          push: false
          load: false
          
  compose-smoke:
    name: Compose build and smoke
    runs-on: ubuntu-latest
    needs: [unit-tests, container-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    env:
      MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Build and start stack
        run: docker compose up --build -d --wait
        
      - name: Check backend
        run: curl --fail --retry 10 --retry-delay 3 http://localhost:5284/health || curl --fail --retry 10 --retry-delay 3 http://localhost:5284/
        
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs
        
      - name: Tear down
        if: always()
        run: docker compose down -v